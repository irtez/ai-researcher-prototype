[project]
name = "holosophus-orchestrator"
version = "0.1.0"
description = "Dependency manifest for the Claude-Code orchestration path (scripts/run_research.py and friends). The CodeArkt path lives in holosophos/ and has its own pyproject."
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.1.51",
    "fastapi>=0.128.8",
    "httpx>=0.28,<1",
    "langfuse>=3",
    "langsmith>=0.7",
    "mcp>=1",
    "openai>=1",
    "opentelemetry-exporter-otlp-proto-http>=1",
    "opentelemetry-sdk>=1",
    "prompt-toolkit>=3.0.52,<4",
    "pydantic-settings>=2.6",
    "python-dotenv>=1",
    "pyyaml>=6",
    "requests>=2",
    "uvicorn>=0.34.3",
]

[dependency-groups]
# The repo-root `tests/` suite covers the Claude-Code orchestration path
# (scripts/*.py). Without pytest declared here, `uv run pytest` falls through to
# whatever pytest is on PATH — a system interpreter with none of the
# dependencies above — and every module that imports run_research or cc_runner
# fails to collect. Declared so `uv run pytest tests/` just works.
dev = [
    "pytest>=8",
    "ruff==0.16.6",
    # Render CodeArkt prompt templates without installing its retired runtime environment.
    "jinja2==3.1.6",
]

[tool.uv]
package = false
