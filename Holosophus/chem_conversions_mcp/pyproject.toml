[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chem-conversions-mcp"
version = "0.1.0"
description = "MCP server for chemical representation conversions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9.2,<2",
    "fire>=0.7.0",
    "requests>=2.32.3",
]

[project.scripts]
chem_conversions_mcp = "chem_conversions_mcp:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["chem_conversions_mcp*"]
