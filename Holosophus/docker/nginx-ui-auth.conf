# Authenticated variant of nginx-ui.conf for the team/internal deploy.
#
# Difference from the base (open) config, and ONLY the difference:
#   1. HTTP Basic auth gates the whole server (SPA + every proxied API).
#      The predefined login/password list lives in a gitignored .htpasswd
#      mounted at /etc/nginx/.htpasswd (see docker-compose.auth.yml).
#   2. Each proxied API overwrites the client-supplied `X-Holo-Client` with the
#      *authenticated* username ($remote_user). The per-owner session isolation
#      already keyed on X-Holo-Client (ui-api owner filter, codearkt owner
#      marker) thus becomes a real auth boundary: the browser can no longer forge
#      another user's identity, and $remote_user is what flows to Langfuse `user`.
#
# Mount this over the baked /etc/nginx/conf.d/default.conf via the auth overlay;
# the base image and nginx-ui.conf stay unchanged for open dev use.

# SC8 (ui-claude-code-orchestrator): identical orchestrator routing to the base
# nginx-ui.conf. This file is a full manual replica of the base config (its own
# server block), so the map + upstream literal are duplicated one-for-one -- the
# same manual-sync pattern already used for the /agents/, /ui/, /capacity blocks.
# tests/test_nginx_orchestrator_routing.py guards this parity against drift.
map $http_x_holo_orchestrator $agents_upstream {
  default      app:5055;
  claude_code  host.docker.internal:5061;
}

server {
  listen 5059;
  server_name _;
  # Keep upload behaviour identical to the open UI; the API owns per-file limits.
  client_max_body_size 256m;

  resolver 127.0.0.11 valid=10s ipv6=off;

  auth_basic "Holosophus";
  auth_basic_user_file /etc/nginx/.htpasswd;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Only iteration-completion notifications use WebSocket.
  location /ui/ws/ {
    set $ui_api_upstream ui-api:5058;
    proxy_pass http://$ui_api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Holo-Client $remote_user;
    proxy_read_timeout 3600s;
    proxy_buffering off;
  }

  location /ui/ {
    set $ui_api_upstream ui-api:5058;
    proxy_pass http://$ui_api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Holo-Client $remote_user;
    proxy_buffering off;
  }

  location /agents/ {
    proxy_pass http://$agents_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Holo-Client $remote_user;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }

  location = /capacity {
    set $app_upstream app:5055;
    proxy_pass http://$app_upstream/capacity;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Holo-Client $remote_user;
  }
}
