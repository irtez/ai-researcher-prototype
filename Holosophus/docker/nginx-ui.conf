# SC8 (ui-claude-code-orchestrator): route /agents/* by the X-Holo-Orchestrator
# header. Default (and any unknown value) stays on the CodeArkt server; a
# claude_code run goes to the host-side cc_runner. This map lives in the http{}
# context (conf.d/*.conf is included there). Port 5061 is a literal on purpose:
# nginx does not expand ${CC_RUNNER_PORT} in conf, so the runner's listen port
# must be kept in sync with it (see design p.6 of the routing spec). When the
# runner is down, the upstream connection fails and nginx returns a non-200 that
# the UI surfaces as an errored run (SC8).
map $http_x_holo_orchestrator $agents_upstream {
  default      app:5055;
  claude_code  host.docker.internal:5061;
}

server {
  listen 5059;
  server_name _;
  # The API enforces 20 MiB per file; leave room for several multipart inputs.
  client_max_body_size 256m;

  resolver 127.0.0.11 valid=10s ipv6=off;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Only iteration-completion notifications use WebSocket.
  location /ui/ws/ {
    set $ui_api_upstream ui-api:5058;
    proxy_pass http://$ui_api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_buffering off;
  }

  location /ui/ {
    set $ui_api_upstream ui-api:5058;
    proxy_pass http://$ui_api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
  }

  location = /agents/express {
    set $ui_api_upstream ui-api:5058;
    proxy_pass http://$ui_api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }

  location /agents/ {
    proxy_pass http://$agents_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }

  location = /capacity {
    set $app_upstream app:5055;
    proxy_pass http://$app_upstream/capacity;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
